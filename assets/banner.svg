<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080b14"/><stop offset="50%" stop-color="#0e1526"/><stop offset="100%" stop-color="#131c38"/></linearGradient><linearGradient id="neonCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f5d4"/><stop offset="100%" stop-color="#00bbf9"/></linearGradient><linearGradient id="neonPurple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#7928ca"/><stop offset="100%" stop-color="#ff0080"/></linearGradient><linearGradient id="cardGlow" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes pulseLight{0%{opacity:.25}50%{opacity:.65}}@keyframes dashMove{0%{stroke-dashoffset:400}}@keyframes nodePulse{0%{transform:scale(1);filter:drop-shadow(0 0 6px #00f5d4)}50%{transform:scale(1.15);filter:drop-shadow(0 0 16px #00f5d4)}}.floating-agent{animation:floatSlow 7s ease-in-out infinite}.pulsing-mesh{animation:pulseLight 4s ease-in-out infinite}.moving-line{stroke-dasharray:8,8;animation:dashMove 20s linear infinite}.agent-node{transform-origin:center;animation:nodePulse 3s ease-in-out infinite}</style></defs><rect width="1200" height="420" fill="url(#bgGradient)" rx="24"/><rect width="1200" height="420" fill="none" stroke="#1e293b" stroke-width="2" rx="24"/><g opacity=".2"><circle cx="150" cy="80" r="180" fill="#7928ca" class="pulsing-mesh" filter="url(#glow)"/><circle cx="1050" cy="340" r="200" fill="#00bbf9" class="pulsing-mesh" filt