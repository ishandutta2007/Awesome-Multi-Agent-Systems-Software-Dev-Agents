<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="50%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#131c38"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.65; }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #00f5d4); }
        50% { transform: scale(1.15); filter: drop-shadow(0 0 16px #00f5d4); }
      }
      .floating-agent { animation: floatSlow 7s ease-in-out infinite; }
      .pulsing-mesh { animation: pulseLight 4s ease-in-out infinite; }
      .moving-line { stroke-dasharray: 8, 8; animation: dashMove 20s linear infinite; }
      .agent-node { transform-origin: center; animation: nodePulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="24" fill="url(#bgGradient)"/>
  <rect width="1200" height="420" rx="24" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Background Grid & Dynamic Particles -->
  <g opacity="0.2">
    <circle cx="150" cy="80" r="180" fill="#7928ca" filter="url(#glow)" class="pulsing-mesh"/>
    <circle cx="1050" cy="340" r="200" fill="#00bbf9" filter="url(#glow)" class="pulsing-mesh" style="animation-delay: -2s;"/>
    <circle cx="600" cy="210" r="140" fill="#ff0080" filter="url(#glow)" opacity="0.1"/>
  </g>

  <!-- Dynamic Orchestration Network Background Lines -->
  <g class="moving-line" stroke="#38bdf8" stroke-width="1.5" opacity="0.35">
    <path d="M100 320 C 300 280, 450 350, 600 310 S 900 270, 1100 320" fill="none"/>
    <path d="M150 100 C 350 140, 500 80, 750 130 S 980 90, 1080 110" fill="none"/>
    <path d="M220 310 L 380 200 L 600 250 L 820 180 L 980 290" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  </g>

  <!-- Agent Network Nodes (Interactive dynamic flow) -->
  <g opacity="0.65">
    <circle cx="220" cy="310" r="8" fill="#00f5d4" class="agent-node"/>
    <circle cx="380" cy="200" r="6" fill="#a855f7" class="agent-node" style="animation-delay: -1s;"/>
    <circle cx="600" cy="250" r="9" fill="#38bdf8" class="agent-node" style="animation-delay: -1.5s;"/>
    <circle cx="820" cy="180" r="7" fill="#ec4899" class="agent-node" style="animation-delay: -2s;"/>
    <circle cx="980" cy="290" r="8" fill="#00f5d4" class="agent-node" style="animation-delay: -0.5s;"/>
  </g>

  <!-- Foreground Title and Hero Badges (Ensuring high contrast & foreground clarity) -->
  <g transform="translate(80, 65)">
    <!-- Category Pill Tag -->
    <rect x="0" y="0" width="350" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="6" fill="#00f5d4"/>
    <text x="34" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2">AUTONOMOUS SOFTWARE DEV ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
      Awesome <tspan fill="url(#neonCyan)">Multi-Agent Systems</tspan>
    </text>
    <text x="0" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.8">
      &amp; <tspan fill="url(#neonPurple)">Software Dev Agents</tspan>
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      Curated directory of autonomous AI coding teams, SWE-bench solvers, agentic IDEs, and runtimes.
    </text>

    <!-- Interactive Role Capability Badges -->
    <g transform="translate(0, 235)">
      <!-- Badge 1: Product Architect -->
      <g>
        <rect x="0" y="0" width="180" height="42" rx="10" fill="url(#cardGlow)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🤖 Architect &amp; PM</text>
      </g>
      <!-- Badge 2: Autonomous Coder -->
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="185" height="42" rx="10" fill="url(#cardGlow)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="26" fill="#00f5d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">⚡ Multi-Agent SWE</text>
      </g>
      <!-- Badge 3: Sandboxed Execution -->
      <g transform="translate(395, 0)">
        <rect x="0" y="0" width="185" height="42" rx="10" fill="url(#cardGlow)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="26" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🛡️ MicroVM Sandbox</text>
      </g>
      <!-- Badge 4: SWE-bench Verified -->
      <g transform="translate(595, 0)">
        <rect x="0" y="0" width="190" height="42" rx="10" fill="url(#cardGlow)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="26" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🏆 SWE-bench Leader</text>
      </g>
    </g>
  </g>

  <!-- Right Decorative Micro-Orchestration Card -->
  <g transform="translate(930, 75)" class="floating-agent">
    <rect width="190" height="220" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.6))"/>
    <rect x="15" y="18" width="40" height="8" rx="4" fill="#38bdf8"/>
    <circle cx="160" cy="22" r="4" fill="#22c55e"/>
    
    <!-- Code Simulation lines -->
    <rect x="15" y="42" width="130" height="7" rx="3.5" fill="#334155"/>
    <rect x="15" y="58" width="95" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="15" y="74" width="145" height="7" rx="3.5" fill="#334155"/>
    <rect x="15" y="90" width="110" height="7" rx="3.5" fill="#1e293b"/>

    <!-- Multi-Agent SDLC Workflow Indicator -->
    <g transform="translate(15, 115)">
      <rect width="160" height="88" rx="10" fill="#131d33" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="24" fill="#00f5d4" font-family="monospace" font-size="11" font-weight="600">git commit &amp; test</text>
      <text x="12" y="45" fill="#94a3b8" font-family="monospace" font-size="10">✓ Plan generated</text>
      <text x="12" y="62" fill="#94a3b8" font-family="monospace" font-size="10">✓ 14 files updated</text>
      <text x="12" y="79" fill="#22c55e" font-family="monospace" font-size="10">✓ SWE-bench: 100%</text>
    </g>
  </g>
</svg>
